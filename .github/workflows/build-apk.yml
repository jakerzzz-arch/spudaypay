name: Build Spudaypay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor & Android Project
        run: |
          mkdir -p www
          cp index.html styles.css app.js music-data.js manifest.json sw.js icon.svg icon-192.png icon-512.png www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Spudaypay" "com.spudaypay.music" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Spudaypay.apk

      - name: Upload Spudaypay.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spudaypay-APK
          path: Spudaypay.apk

      - name: Create GitHub Release with Spudaypay.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Spudaypay.apk --title "Spudaypay Android APK v1.0.${{ github.run_number }}" --notes "100% Standalone Spudaypay Android APK (No Chrome required)"
