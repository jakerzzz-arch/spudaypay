name: Build Spudaypay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Prepare Assets
        run: |
          npm install
          mkdir -p www
          cp -r index.html styles.css app.js music-data.js manifest.json sw.js icon.svg icon-192.png icon-512.png www/

      - name: Initialize Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/g' android/app/build.gradle
          node -e '
            const fs = require("fs");
            const wvPath = "node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/CapacitorWebView.java";
            if (fs.existsSync(wvPath)) {
              let src = fs.readFileSync(wvPath, "utf8");
              if (!src.includes("onWindowVisibilityChanged")) {
                const patch = [
                  "    @Override",
                  "    protected void onWindowVisibilityChanged(int visibility) {",
                  "        super.onWindowVisibilityChanged(android.view.View.VISIBLE);",
                  "    }",
                  "    @Override",
                  "    protected void onVisibilityChanged(android.view.View changedView, int visibility) {",
                  "        super.onVisibilityChanged(changedView, android.view.View.VISIBLE);",
                  "    }",
                  "    @Override",
                  "    public void scrollTo(int x, int y) {",
                  "        super.scrollTo(0, y);",
                  "    }",
                  "    @Override",
                  "    public void onPause() {",
                  "    }",
                  "}"
                ].join("\n");
                src = src.replace(/\}\s*$/, patch);
                fs.writeFileSync(wvPath, src, "utf8");
                console.log("Patched CapacitorWebView for nonstop background playback and horizontal scroll lock");
              }
            }
          '
          sed -i 's|</application>|        <service android:name=".AudioForegroundService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>|g' android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>|g' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/java/com/spudaypay/music/AudioForegroundService.java
          package com.spudaypay.music;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class AudioForegroundService extends Service {
              private static final String CHANNEL_ID = "spudaypay_bg_audio";
              private PowerManager.WakeLock wakeLock;
              private WifiManager.WifiLock wifiLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Spudaypay:FgAudioWakeLock");
                          wakeLock.acquire();
                      }
                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wm != null) {
                          wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "Spudaypay:FgWifiLock");
                          wifiLock.acquire();
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                          NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Spudaypay Background Playback",
                              NotificationManager.IMPORTANCE_LOW
                          );
                          channel.setDescription("Keeps Spudaypay music playing while switching apps");
                          nm.createNotificationChannel(channel);
                      }

                      Intent openIntent = new Intent(this, MainActivity.class);
                      openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      int piFlags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                          ? PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                          : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, openIntent, piFlags);

                      Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, CHANNEL_ID)
                          : new Notification.Builder(this);

                      Notification notification = builder
                          .setContentTitle("Spudaypay Music")
                          .setContentText("Background audio playback active")
                          .setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build();

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(1001, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(1001, notification);
                      }
                  } catch (Exception ignored) {}
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) {
                      try { wakeLock.release(); } catch (Exception ignored) {}
                  }
                  if (wifiLock != null && wifiLock.isHeld()) {
                      try { wifiLock.release(); } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF
          cat << 'EOF' > android/app/src/main/java/com/spudaypay/music/MainActivity.java
          package com.spudaypay.music;

          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.content.Context;
          import android.content.Intent;
          import android.webkit.DownloadListener;
          import android.app.DownloadManager;
          import android.net.Uri;
          import android.os.Environment;
          import android.webkit.URLUtil;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().clearCache(true);
                      this.bridge.getWebView().setHorizontalScrollBarEnabled(false);
                      this.bridge.getWebView().setOverScrollMode(android.view.View.OVER_SCROLL_NEVER);
                      this.bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                      this.bridge.getWebView().getSettings().setJavaScriptCanOpenWindowsAutomatically(true);

                      this.bridge.getWebView().setDownloadListener(new DownloadListener() {
                          @Override
                          public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                              try {
                                  if (url.startsWith("blob:") || url.startsWith("data:")) {
                                      return;
                                  }
                                  DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                                  if (mimetype != null && !mimetype.isEmpty()) {
                                      request.setMimeType(mimetype);
                                  }
                                  String fileName = URLUtil.guessFileName(url, contentDisposition, mimetype);
                                  if (!fileName.endsWith(".mp3") && !fileName.endsWith(".m4a")) {
                                      fileName = fileName + ".mp3";
                                  }
                                  request.setTitle(fileName);
                                  request.setDescription("Downloading Spudaypay song...");
                                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                  request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                                  if (dm != null) {
                                      dm.enqueue(request);
                                      Toast.makeText(getApplicationContext(), "Downloading: " + fileName, Toast.LENGTH_SHORT).show();
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  }

                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Spudaypay:AudioPlaybackLock");
                          wakeLock.acquire();
                      }
                  } catch (Exception ignored) {}

                  try {
                      Intent serviceIntent = new Intent(this, AudioForegroundService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().onResume();
                      this.bridge.getWebView().resumeTimers();
                      this.bridge.getWebView().evaluateJavascript("if (typeof ensureBackgroundPlayback === 'function') ensureBackgroundPlayback();", null);
                  }
              }

              @Override
              public void onStop() {
                  super.onStop();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().onResume();
                      this.bridge.getWebView().resumeTimers();
                      this.bridge.getWebView().evaluateJavascript("if (typeof ensureBackgroundPlayback === 'function') ensureBackgroundPlayback();", null);
                  }
              }

              @Override
              public void onDestroy() {
                  try {
                      stopService(new Intent(this, AudioForegroundService.class));
                  } catch (Exception ignored) {}
                  if (wakeLock != null && wakeLock.isHeld()) {
                      try { wakeLock.release(); } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Spudaypay.apk

      - name: Upload Spudaypay.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spudaypay-APK
          path: Spudaypay.apk

      - name: Create GitHub Release with Spudaypay.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Spudaypay.apk --title "Spudaypay Android APK v1.0.${{ github.run_number }}" --notes "100% Standalone Spudaypay Android APK (No Chrome required)" || echo "Release created or updated"
