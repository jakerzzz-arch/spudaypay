name: Build Spudaypay Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Prepare Assets
        run: |
          npm install
          mkdir -p www
          cp -r index.html styles.css app.js music-data.js manifest.json sw.js icon.svg icon-192.png icon-512.png www/

      - name: Initialize Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android
          node -e '
            const fs = require("fs");
            const wvPath = "node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/CapacitorWebView.java";
            if (fs.existsSync(wvPath)) {
              let src = fs.readFileSync(wvPath, "utf8");
              if (!src.includes("onWindowVisibilityChanged")) {
                const patch = [
                  "    @Override",
                  "    protected void onWindowVisibilityChanged(int visibility) {",
                  "        super.onWindowVisibilityChanged(android.view.View.VISIBLE);",
                  "    }",
                  "    @Override",
                  "    protected void onVisibilityChanged(android.view.View changedView, int visibility) {",
                  "        super.onVisibilityChanged(changedView, android.view.View.VISIBLE);",
                  "    }",
                  "    @Override",
                  "    public void onPause() {",
                  "    }",
                  "}"
                ].join("\n");
                src = src.replace(/\}\s*$/, patch);
                fs.writeFileSync(wvPath, src, "utf8");
                console.log("Patched CapacitorWebView for nonstop background playback");
              }
            }
          '
          sed -i 's|</application>|        <service android:name=".AudioForegroundService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>|g' android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>|g' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/java/com/spudaypay/music/AudioForegroundService.java
          package com.spudaypay.music;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class AudioForegroundService extends Service {
              private static final String CHANNEL_ID = "spudaypay_media_playback";
              private static final int NOTIFICATION_ID = 1001;

              private PowerManager.WakeLock wakeLock;
              private WifiManager.WifiLock wifiLock;
              private MediaSession mediaSession;
              private NotificationManager notificationManager;
              private Handler mainHandler;

              private String currentTitle = "Spudaypay Music";
              private String currentArtist = "Tap to open player";
              private String currentAlbum = "Spudaypay";
              private String currentCoverUrl = "";
              private Bitmap currentCoverBitmap = null;
              private boolean isPlaying = false;
              private long currentPosition = 0;
              private long currentDuration = 0;

              @Override
              public void onCreate() {
                  super.onCreate();
                  mainHandler = new Handler(Looper.getMainLooper());
                  notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);

                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Spudaypay:FgAudioWakeLock");
                          wakeLock.acquire();
                      }
                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wm != null) {
                          wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "Spudaypay:FgWifiLock");
                          wifiLock.acquire();
                      }
                  } catch (Exception ignored) {}

                  initMediaSession();
                  createNotificationChannel();
              }

              private void initMediaSession() {
                  try {
                      mediaSession = new MediaSession(this, "SpudaypaySession");
                      mediaSession.setFlags(MediaSession.FLAG_HANDLES_MEDIA_BUTTONS | MediaSession.FLAG_HANDLES_TRANSPORT_CONTROLS);
                      mediaSession.setCallback(new MediaSession.Callback() {
                          @Override
                          public void onPlay() {
                              MainActivity.sendPlayerCommand("window.playTrack && window.playTrack();");
                          }
                          @Override
                          public void onPause() {
                              MainActivity.sendPlayerCommand("window.pauseTrack && window.pauseTrack();");
                          }
                          @Override
                          public void onSkipToNext() {
                              MainActivity.sendPlayerCommand("window.playNextTrack && window.playNextTrack();");
                          }
                          @Override
                          public void onSkipToPrevious() {
                              MainActivity.sendPlayerCommand("window.playPrevTrack && window.playPrevTrack();");
                          }
                          @Override
                          public void onSeekTo(long pos) {
                              MainActivity.sendPlayerCommand("window.seekTo && window.seekTo(" + (pos / 1000) + ");");
                          }
                      });
                      mediaSession.setActive(true);
                  } catch (Exception ignored) {}
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && notificationManager != null) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Spudaypay Media Controls",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Shows currently playing song and playback controls");
                      channel.setShowBadge(false);
                      channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      notificationManager.createNotificationChannel(channel);
                  }
              }

              private Notification buildNotification() {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  int piFlags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                      ? PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                      : PendingIntent.FLAG_UPDATE_CURRENT;
                  PendingIntent pendingIntentOpen = PendingIntent.getActivity(this, 100, openIntent, piFlags);

                  Intent prevIntent = new Intent(this, AudioForegroundService.class).setAction("ACTION_PREV");
                  PendingIntent piPrev = PendingIntent.getService(this, 101, prevIntent, piFlags);

                  Intent toggleIntent = new Intent(this, AudioForegroundService.class).setAction("ACTION_TOGGLE");
                  PendingIntent piToggle = PendingIntent.getService(this, 102, toggleIntent, piFlags);

                  Intent nextIntent = new Intent(this, AudioForegroundService.class).setAction("ACTION_NEXT");
                  PendingIntent piNext = PendingIntent.getService(this, 103, nextIntent, piFlags);

                  Notification.Builder builder = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, CHANNEL_ID)
                      : new Notification.Builder(this);

                  builder.setContentTitle(currentTitle)
                      .setContentText(currentArtist)
                      .setSubText(currentAlbum)
                      .setContentIntent(pendingIntentOpen)
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setOngoing(isPlaying);

                  if (currentCoverBitmap != null) {
                      builder.setLargeIcon(currentCoverBitmap);
                  }

                  Notification.Action prevAction = new Notification.Action.Builder(
                      android.R.drawable.ic_media_previous,
                      "Previous",
                      piPrev
                  ).build();

                  Notification.Action toggleAction = new Notification.Action.Builder(
                      isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                      isPlaying ? "Pause" : "Play",
                      piToggle
                  ).build();

                  Notification.Action nextAction = new Notification.Action.Builder(
                      android.R.drawable.ic_media_next,
                      "Next",
                      piNext
                  ).build();

                  builder.addAction(prevAction);
                  builder.addAction(toggleAction);
                  builder.addAction(nextAction);

                  if (mediaSession != null) {
                      Notification.MediaStyle style = new Notification.MediaStyle()
                          .setMediaSession(mediaSession.getSessionToken())
                          .setShowActionsInCompactView(0, 1, 2);
                      builder.setStyle(style);
                  }

                  return builder.build();
              }

              private void updateNotificationAndSession(String title, String artist, String album, String coverUrl, boolean playing, long position, long duration) {
                  if (title != null && !title.isEmpty()) currentTitle = title;
                  if (artist != null && !artist.isEmpty()) currentArtist = artist;
                  if (album != null && !album.isEmpty()) currentAlbum = album;
                  isPlaying = playing;
                  currentPosition = position;
                  currentDuration = duration;

                  if (mediaSession != null) {
                      try {
                          PlaybackState.Builder psb = new PlaybackState.Builder()
                              .setState(
                                  isPlaying ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED,
                                  currentPosition * 1000L,
                                  1.0f
                              )
                              .setActions(
                                  PlaybackState.ACTION_PLAY |
                                  PlaybackState.ACTION_PAUSE |
                                  PlaybackState.ACTION_PLAY_PAUSE |
                                  PlaybackState.ACTION_SKIP_TO_NEXT |
                                  PlaybackState.ACTION_SKIP_TO_PREVIOUS |
                                  PlaybackState.ACTION_SEEK_TO
                              );
                          mediaSession.setPlaybackState(psb.build());

                          MediaMetadata.Builder mmb = new MediaMetadata.Builder()
                              .putString(MediaMetadata.METADATA_KEY_TITLE, currentTitle)
                              .putString(MediaMetadata.METADATA_KEY_ARTIST, currentArtist)
                              .putString(MediaMetadata.METADATA_KEY_ALBUM, currentAlbum)
                              .putLong(MediaMetadata.METADATA_KEY_DURATION, currentDuration * 1000L);
                          if (currentCoverBitmap != null) {
                              mmb.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, currentCoverBitmap);
                              mmb.putBitmap(MediaMetadata.METADATA_KEY_ART, currentCoverBitmap);
                          }
                          mediaSession.setMetadata(mmb.build());
                      } catch (Exception ignored) {}
                  }

                  Notification n = buildNotification();
                  if (notificationManager != null) {
                      try {
                          notificationManager.notify(NOTIFICATION_ID, n);
                      } catch (Exception ignored) {}
                  }

                  if (coverUrl != null && !coverUrl.isEmpty() && !coverUrl.equals(currentCoverUrl)) {
                      currentCoverUrl = coverUrl;
                      new Thread(() -> {
                          Bitmap bmp = downloadBitmap(currentCoverUrl);
                          if (bmp != null) {
                              currentCoverBitmap = bmp;
                              mainHandler.post(() -> {
                                  if (mediaSession != null) {
                                      try {
                                          MediaMetadata.Builder mmb = new MediaMetadata.Builder()
                                              .putString(MediaMetadata.METADATA_KEY_TITLE, currentTitle)
                                              .putString(MediaMetadata.METADATA_KEY_ARTIST, currentArtist)
                                              .putString(MediaMetadata.METADATA_KEY_ALBUM, currentAlbum)
                                              .putLong(MediaMetadata.METADATA_KEY_DURATION, currentDuration * 1000L)
                                              .putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, currentCoverBitmap)
                                              .putBitmap(MediaMetadata.METADATA_KEY_ART, currentCoverBitmap);
                                          mediaSession.setMetadata(mmb.build());
                                      } catch (Exception ignored) {}
                                  }
                                  Notification notif = buildNotification();
                                  if (notificationManager != null) {
                                      try {
                                          notificationManager.notify(NOTIFICATION_ID, notif);
                                      } catch (Exception ignored) {}
                                  }
                              });
                          }
                      }).start();
                  }
              }

              private Bitmap downloadBitmap(String urlStr) {
                  try {
                      URL url = new URL(urlStr);
                      HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                      conn.setConnectTimeout(4000);
                      conn.setReadTimeout(4000);
                      conn.setDoInput(true);
                      conn.connect();
                      InputStream is = conn.getInputStream();
                      Bitmap bmp = BitmapFactory.decodeStream(is);
                      is.close();
                      conn.disconnect();
                      if (bmp != null) {
                          return Bitmap.createScaledBitmap(bmp, 256, 256, true);
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && intent.getAction() != null) {
                      String action = intent.getAction();
                      if ("ACTION_TOGGLE".equals(action)) {
                          MainActivity.sendPlayerCommand("window.togglePlayPause && window.togglePlayPause();");
                      } else if ("ACTION_PLAY".equals(action)) {
                          MainActivity.sendPlayerCommand("window.playTrack && window.playTrack();");
                      } else if ("ACTION_PAUSE".equals(action)) {
                          MainActivity.sendPlayerCommand("window.pauseTrack && window.pauseTrack();");
                      } else if ("ACTION_NEXT".equals(action)) {
                          MainActivity.sendPlayerCommand("window.playNextTrack && window.playNextTrack();");
                      } else if ("ACTION_PREV".equals(action)) {
                          MainActivity.sendPlayerCommand("window.playPrevTrack && window.playPrevTrack();");
                      } else if ("ACTION_SEEK".equals(action)) {
                          long sec = intent.getLongExtra("seconds", 0);
                          MainActivity.sendPlayerCommand("window.seekTo && window.seekTo(" + sec + ");");
                      } else if ("UPDATE_TRACK".equals(action)) {
                          String title = intent.getStringExtra("title");
                          String artist = intent.getStringExtra("artist");
                          String album = intent.getStringExtra("album");
                          String coverUrl = intent.getStringExtra("coverUrl");
                          boolean isPlayingState = intent.getBooleanExtra("isPlaying", false);
                          long pos = intent.getLongExtra("position", 0);
                          long dur = intent.getLongExtra("duration", 0);
                          updateNotificationAndSession(title, artist, album, coverUrl, isPlayingState, pos, dur);
                      }
                  }

                  Notification notification = buildNotification();
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(NOTIFICATION_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(NOTIFICATION_ID, notification);
                      }
                  } catch (Exception ignored) {}

                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (mediaSession != null) {
                      try {
                          mediaSession.setActive(false);
                          mediaSession.release();
                      } catch (Exception ignored) {}
                  }
                  if (wakeLock != null && wakeLock.isHeld()) {
                      try { wakeLock.release(); } catch (Exception ignored) {}
                  }
                  if (wifiLock != null && wifiLock.isHeld()) {
                      try { wifiLock.release(); } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF
          cat << 'EOF' > android/app/src/main/java/com/spudaypay/music/MainActivity.java
          package com.spudaypay.music;

          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.content.Context;
          import android.content.Intent;
          import android.webkit.DownloadListener;
          import android.app.DownloadManager;
          import android.net.Uri;
          import android.os.Environment;
          import android.webkit.URLUtil;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static MainActivity instance;
              private PowerManager.WakeLock wakeLock;

              public static MainActivity getInstance() {
                  return instance;
              }

              public static void sendPlayerCommand(String command) {
                  if (instance != null && instance.bridge != null && instance.bridge.getWebView() != null) {
                      instance.runOnUiThread(() -> {
                          try {
                              instance.bridge.getWebView().evaluateJavascript(command, null);
                          } catch (Exception ignored) {}
                      });
                  }
              }

              public class AndroidMediaBridge {
                  @JavascriptInterface
                  public void updateMedia(String title, String artist, String album, String coverUrl, boolean isPlaying, long position, long duration) {
                      try {
                          Intent intent = new Intent(MainActivity.this, AudioForegroundService.class);
                          intent.setAction("UPDATE_TRACK");
                          intent.putExtra("title", title);
                          intent.putExtra("artist", artist);
                          intent.putExtra("album", album);
                          intent.putExtra("coverUrl", coverUrl);
                          intent.putExtra("isPlaying", isPlaying);
                          intent.putExtra("position", position);
                          intent.putExtra("duration", duration);
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(intent);
                          } else {
                              startService(intent);
                          }
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  instance = this;

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().clearCache(true);
                      this.bridge.getWebView().setHorizontalScrollBarEnabled(false);
                      this.bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                      this.bridge.getWebView().getSettings().setJavaScriptCanOpenWindowsAutomatically(true);

                      this.bridge.getWebView().addJavascriptInterface(new AndroidMediaBridge(), "AndroidMediaBridge");

                      this.bridge.getWebView().setDownloadListener(new DownloadListener() {
                          @Override
                          public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                              try {
                                  if (url.startsWith("blob:") || url.startsWith("data:")) {
                                      return;
                                  }
                                  DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                                  if (mimetype != null && !mimetype.isEmpty()) {
                                      request.setMimeType(mimetype);
                                  }
                                  String fileName = URLUtil.guessFileName(url, contentDisposition, mimetype);
                                  if (!fileName.endsWith(".mp3") && !fileName.endsWith(".m4a")) {
                                      fileName = fileName + ".mp3";
                                  }
                                  request.setTitle(fileName);
                                  request.setDescription("Downloading Spudaypay song...");
                                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                  request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                                  if (dm != null) {
                                      dm.enqueue(request);
                                      Toast.makeText(getApplicationContext(), "Downloading: " + fileName, Toast.LENGTH_SHORT).show();
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 1001);
                      }
                  }

                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Spudaypay:AudioPlaybackLock");
                          wakeLock.acquire();
                      }
                  } catch (Exception ignored) {}

                  try {
                      Intent serviceIntent = new Intent(this, AudioForegroundService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().onResume();
                      this.bridge.getWebView().resumeTimers();
                      this.bridge.getWebView().evaluateJavascript("if (typeof ensureBackgroundPlayback === 'function') ensureBackgroundPlayback();", null);
                  }
              }

              @Override
              public void onStop() {
                  super.onStop();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().onResume();
                      this.bridge.getWebView().resumeTimers();
                      this.bridge.getWebView().evaluateJavascript("if (typeof ensureBackgroundPlayback === 'function') ensureBackgroundPlayback();", null);
                  }
              }

              @Override
              public void onDestroy() {
                  try {
                      stopService(new Intent(this, AudioForegroundService.class));
                  } catch (Exception ignored) {}
                  if (wakeLock != null && wakeLock.isHeld()) {
                      try { wakeLock.release(); } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Spudaypay.apk

      - name: Upload Spudaypay.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spudaypay-APK
          path: Spudaypay.apk

      - name: Create GitHub Release with Spudaypay.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Spudaypay.apk --title "Spudaypay Android APK v1.0.${{ github.run_number }}" --notes "100% Standalone Spudaypay Android APK (No Chrome required)" || echo "Release created or updated"
